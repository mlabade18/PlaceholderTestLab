[pytest]
# Pytest Configuration for Parallel Execution

# Markers
markers =
    smoke: Quick smoke tests
    regression: Full regression tests
    schema: Schema validation tests
    database: Database related tests
    negative: Negative test cases

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Parallel execution settings (when using -n flag)
# dist = loadscope (distribute by test class/module)
# dist = loadfile (distribute by test file)
